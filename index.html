<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Giá Vàng - TÍN THÀNH DUY MONG</title>
    <!-- Thêm phông chữ Sang trọng (Playfair Display) và Hiện đại (Montserrat cho số) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        page: '#FDFBF7',     // Trắng kem nhẹ nhàng
                        card: '#FFFFFF', 
                        textMain: '#2A2118', // Nâu đen tĩnh
                        primary: '#631616',  // Đỏ đô trầm từ logo
                        gold: '#C29B57',     // Vàng kim loại
                        borderMain: '#E3D7C5',
                        up: '#237A57', 
                        down: '#B74343'
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Hiệu ứng chữ vàng kim loại tân cổ điển */
        .text-metallic {
            background: linear-gradient(to right, #B38728, #FBF5B7, #DAA520, #FBF5B7, #B38728);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0px 1px 2px rgba(0,0,0,0.1);
        }
        .border-double-custom {
            border: 4px double #E3D7C5;
        }
    </style>
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

     // Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyDVzBg3eEwjqNLwec62_w4rX9Tt9KHVGTg",
  authDomain: "tinthanhduymong9999.firebaseapp.com",
  databaseURL: "https://tinthanhduymong9999-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "tinthanhduymong9999",
  storageBucket: "tinthanhduymong9999.firebasestorage.app",
  messagingSenderId: "610128086774",
  appId: "1:610128086774:web:81eb465444de721a77ced7",
  measurementId: "G-HKDDT3N2QE"
};
    
        const urlParams = new URLSearchParams(window.location.search);
        const isTvMode = urlParams.get('mode') === 'tv';

        if(isTvMode) {
            document.getElementById('footer-contact').style.display = 'none';
            document.body.classList.add('text-xl'); 
        }

        const formatCurrency = (val) => new Intl.NumberFormat('vi-VN').format(val);

        onValue(ref(db, 'current'), (snapshot) => {
            const data = snapshot.val();
            if (!data) {
                document.getElementById('status-time').innerText = "Hệ thống đang chuẩn bị dữ liệu...";
                return;
            }

            const updateTime = new Date(data.timestamp);
            const now = new Date();
            const isToday = updateTime.getDate() === now.getDate() && updateTime.getMonth() === now.getMonth();
            
            document.getElementById('status-time').innerText = isToday 
                ? `Cập nhật lúc: ${updateTime.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'})} ngày ${updateTime.toLocaleDateString('vi-VN')}`
                : `Chưa có cập nhật hôm nay (Giá chốt lúc: ${updateTime.toLocaleTimeString('vi-VN', {hour: '2-digit', minute:'2-digit'})} ngày ${updateTime.toLocaleDateString('vi-VN')})`;

            const tbody = document.getElementById('price-table-body');
            tbody.innerHTML = '';
            
            data.items.forEach(item => {
                if(item.hidden) return;
                
                const tr = document.createElement('tr');
                tr.className = "border-b border-gray-100 last:border-0 hover:bg-gray-50 transition-colors";
                
                const buyTrend = item.buyDiff > 0 ? `<span class="text-up text-xs font-bold ml-1">▲</span>` : (item.buyDiff < 0 ? `<span class="text-down text-xs font-bold ml-1">▼</span>` : '');
                const sellTrend = item.sellDiff > 0 ? `<span class="text-up text-xs font-bold ml-1">▲</span>` : (item.sellDiff < 0 ? `<span class="text-down text-xs font-bold ml-1">▼</span>` : '');

                tr.innerHTML = `
                    <td class="py-4 px-4 font-serif font-medium text-textMain text-lg">${item.name}</td>
                    <td class="py-4 px-4 text-right text-textMain font-semibold tracking-wide">${formatCurrency(item.buy)} ${buyTrend}</td>
                    <td class="py-4 px-4 text-right text-textMain font-semibold tracking-wide">${formatCurrency(item.sell)} ${sellTrend}</td>
                `;
                tbody.appendChild(tr);
            });

            if(!isTvMode && data.note) {
                document.getElementById('store-note').innerText = data.note;
            }
        });
    </script>
</head>
<body class="bg-page min-h-screen text-textMain antialiased p-4 md:p-8 font-sans">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-8 flex flex-col items-center">
            <!-- Hiển thị Logo -->
            <img src="logo.png" alt="Tín Thành Duy Mong Logo" class="h-24 md:h-28 mb-4 object-contain" onerror="this.style.display='none'">
            
            <h1 class="font-serif text-3xl md:text-5xl font-bold mb-3 tracking-wide text-metallic uppercase">Bảng Giá Vàng</h1>
            
            <div class="flex items-center justify-center gap-2 mb-2">
                <span class="w-12 h-[1px] bg-gold opacity-50"></span>
                <span class="text-gold text-xl font-serif">✧</span>
                <span class="w-12 h-[1px] bg-gold opacity-50"></span>
            </div>
            
            <p id="status-time" class="text-sm md:text-base text-gray-500 font-medium italic font-serif tracking-wide">Đang kết nối dữ liệu...</p>
        </div>

        <!-- Bảng giá (Khung viền đôi tân cổ điển) -->
        <div class="bg-card p-1 md:p-2 shadow-xl shadow-[rgba(99,22,22,0.03)] mb-8">
            <div class="border-double-custom p-2 md:p-6 bg-card">
                <div class="text-right text-xs md:text-sm text-gray-400 mb-4 font-medium tracking-wider uppercase">
                    Đơn vị tính: VNĐ / Chỉ
                </div>
                <table class="w-full text-left border-collapse">
                    <thead class="border-b-2 border-gold text-primary font-serif">
                        <tr>
                            <th class="py-3 px-4 font-semibold text-lg tracking-wider w-1/3">Loại vàng</th>
                            <th class="py-3 px-4 font-semibold text-lg tracking-wider text-right w-1/3">Mua vào</th>
                            <th class="py-3 px-4 font-semibold text-lg tracking-wider text-right w-1/3">Bán ra</th>
                        </tr>
                    </thead>
                    <tbody id="price-table-body">
                        <!-- Render từ Firebase -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Footer / Contact -->
        <div id="footer-contact" class="text-center border-t border-borderMain pt-8 mt-8">
            <p id="store-note" class="italic text-sm text-gray-500 mb-6 font-serif"></p>
            <div class="flex justify-center gap-4">
                <a href="tel:0123456789" class="bg-primary text-gold px-8 py-2.5 hover:bg-[#4a1010] transition-colors font-serif tracking-widest text-sm shadow-md border border-primary">GỌI ĐIỆN</a>
                <a href="#" class="bg-transparent text-primary border border-primary px-8 py-2.5 hover:bg-gray-50 transition-colors font-serif tracking-widest text-sm shadow-sm">ZALO / BẢN ĐỒ</a>
            </div>
            <p class="mt-8 text-xs text-gray-400 font-serif tracking-widest uppercase">Tinh xảo trong từng chi tiết</p>
        </div>
    </div>

</body>
</html>
