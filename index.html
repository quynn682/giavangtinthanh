<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Giá Vàng - TÍN THÀNH DUY MONG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        page: '#FAF7F2', card: '#FFFFFF', textMain: '#302820',
                        gold: '#C6A66B', btnPrimary: '#80602D', borderMain: '#E8DFD2',
                        up: '#237A57', down: '#B74343'
                    }
                }
            }
        }
    </script>
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // CẤU HÌNH FIREBASE CỦA BẠN VÀO ĐÂY
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT.firebasedatabase.app",
            projectId: "YOUR_PROJECT"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        const urlParams = new URLSearchParams(window.location.search);
        const isTvMode = urlParams.get('mode') === 'tv';

        if(isTvMode) {
            document.getElementById('footer-contact').style.display = 'none';
            document.body.classList.add('text-xl'); // Tăng kích thước chữ cho TV
        }

        const formatCurrency = (val) => new Intl.NumberFormat('vi-VN').format(val);

        onValue(ref(db, 'current'), (snapshot) => {
            const data = snapshot.val();
            if (!data) {
                document.getElementById('status-time').innerText = "Cửa hàng đang cập nhật bảng giá (DỮ LIỆU MẪU)";
                return;
            }

            const updateTime = new Date(data.timestamp);
            const now = new Date();
            const isToday = updateTime.getDate() === now.getDate() && updateTime.getMonth() === now.getMonth();
            
            document.getElementById('status-time').innerText = isToday 
                ? `Cập nhật giá lúc: ${updateTime.toLocaleTimeString('vi-VN')} - ${updateTime.toLocaleDateString('vi-VN')}`
                : `Chưa có cập nhật hôm nay (Giá chốt lúc: ${updateTime.toLocaleTimeString('vi-VN')} - ${updateTime.toLocaleDateString('vi-VN')})`;

            const tbody = document.getElementById('price-table-body');
            tbody.innerHTML = '';
            
            data.items.forEach(item => {
                if(item.hidden) return;
                
                const tr = document.createElement('tr');
                tr.className = "border-b border-borderMain last:border-0";
                
                // Hiệu ứng tăng giảm
                const buyTrend = item.buyDiff > 0 ? `<span class="text-up text-sm ml-1">↑</span>` : (item.buyDiff < 0 ? `<span class="text-down text-sm ml-1">↓</span>` : '');
                const sellTrend = item.sellDiff > 0 ? `<span class="text-up text-sm ml-1">↑</span>` : (item.sellDiff < 0 ? `<span class="text-down text-sm ml-1">↓</span>` : '');

                tr.innerHTML = `
                    <td class="py-3 px-2 font-medium text-textMain">${item.name}</td>
                    <td class="py-3 px-2 text-right text-textMain font-bold">${formatCurrency(item.buy)} ${buyTrend}</td>
                    <td class="py-3 px-2 text-right text-textMain font-bold">${formatCurrency(item.sell)} ${sellTrend}</td>
                `;
                tbody.appendChild(tr);
            });

            if(!isTvMode && data.note) {
                document.getElementById('store-note').innerText = data.note;
            }
        });
    </script>
    <style> body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; } </style>
</head>
<body class="bg-page min-h-screen text-textMain antialiased p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-6">
            <h2 class="text-2xl md:text-3xl font-bold tracking-widest text-textMain mb-2 uppercase">Tín Thành Duy Mong</h2>
            <h1 class="text-3xl md:text-4xl font-extrabold text-gold mb-2">BẢNG GIÁ VÀNG</h1>
            <p id="status-time" class="text-sm md:text-base text-gray-600 font-medium">Đang kết nối dữ liệu...</p>
            <p class="text-sm text-gray-500 mt-1">Đơn vị: VNĐ / Chỉ</p>
        </div>

        <!-- Bảng giá -->
        <div class="bg-card rounded-lg shadow-sm border border-borderMain overflow-hidden mb-6">
            <table class="w-full text-left border-collapse">
                <thead class="bg-page border-b border-borderMain text-textMain">
                    <tr>
                        <th class="py-3 px-2 font-semibold w-1/3">Loại vàng</th>
                        <th class="py-3 px-2 font-semibold text-right w-1/3">Mua vào</th>
                        <th class="py-3 px-2 font-semibold text-right w-1/3">Bán ra</th>
                    </tr>
                </thead>
                <tbody id="price-table-body">
                    <!-- Render từ Firebase -->
                </tbody>
            </table>
            <div class="bg-page p-3 text-xs text-gray-500 border-t border-borderMain">
                * Mua vào: Cửa hàng mua từ khách | * Bán ra: Cửa hàng bán cho khách
            </div>
        </div>

        <!-- Footer / Contact -->
        <div id="footer-contact" class="text-center">
            <p id="store-note" class="italic text-sm text-gray-600 mb-4"></p>
            <div class="flex justify-center gap-4">
                <a href="tel:0123456789" class="bg-btnPrimary text-card px-6 py-2 rounded font-medium shadow-sm hover:opacity-90 transition">Gọi điện</a>
                <a href="#" class="bg-card text-btnPrimary border border-btnPrimary px-6 py-2 rounded font-medium shadow-sm hover:bg-page transition">Zalo / Chỉ đường</a>
            </div>
        </div>
    </div>

</body>
</html>
